<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>에어컨·냉난방기 문의 관리</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./_next/static/css/index.DVxKmDwC.css">
</head>
<body>
  <main id="login" class="admin-login">
    <form id="login-form" autocomplete="on">
      <span>LEAD DESK</span>
      <h1>에어컨·냉난방기 문의 관리</h1>
      <p>관리 비밀번호를 입력하면 접수 목록을 확인할 수 있습니다.</p>
      <label>관리 비밀번호
        <input id="admin-key" name="password" type="password" required autofocus autocomplete="current-password">
      </label>
      <div id="login-error" class="admin-error" hidden></div>
      <button id="login-button" type="submit">관리 화면 열기</button>
      <a href="./">고객 화면으로 돌아가기</a>
    </form>
  </main>

  <main id="dashboard" class="admin-page" hidden>
    <header>
      <div><span>LEAD DESK</span><h1>에어컨·냉난방기 문의 관리</h1></div>
      <div>
        <button id="refresh" type="button">새로고침</button>
        <button id="csv" type="button">CSV 다운로드</button>
        <a href="./">고객 화면</a>
      </div>
    </header>
    <p class="admin-retention">매일 문의를 확인해주세요. 미계약 건은 상담이 끝나면 ‘미계약 상담 종료’를 선택합니다. 종료 후 3개월이 지난 건은 접수·관리자 조회 시 삭제됩니다. 내려받은 CSV도 같은 기준으로 삭제해주세요.</p><button id="logout" type="button">로그아웃</button><section class="admin-stats">
      <article><span>전체 접수</span><b id="total-count">0</b></article>
      <article><span>신규 문의</span><b id="new-count">0</b></article>
      <article><span>계약·완료</span><b id="won-count">0</b></article>
    </section>
    <section class="admin-toolbar">
      <input id="search" type="search" placeholder="전화번호·지역·서비스·광고 키워드 검색">
      <span id="visible-count">0건 표시</span>
    </section>
    <div id="dashboard-error" class="admin-error" hidden></div>
    <section class="admin-table-wrap">
      <table>
        <thead><tr><th>접수</th><th>상태</th><th>고객 연락처</th><th>문의 내용</th><th>광고 정보</th></tr></thead>
        <tbody id="lead-rows"></tbody>
      </table>
      <p id="empty" class="admin-empty" hidden>표시할 문의가 없습니다.</p>
    </section>
  </main>

  <script>
    const API_URL = 'https://kimdaegon-aircon.bbinge95.chatgpt.site/api/leads';
    const labels = { new:'신규', contacted:'연락 완료', quoting:'견적 진행', won:'계약', completed:'작업 완료', hold:'보류', closed:'미계약 상담 종료' };
    let adminKey = '';
    let leads = [];

    const $ = id => document.getElementById(id);
    const showError = (id, message='') => { const el=$(id); el.textContent=message; el.hidden=!message; };
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

    async function readJson(response) {
      const text = await response.text();
      try { return text ? JSON.parse(text) : {}; }
      catch { throw new Error('서버 응답을 확인할 수 없습니다. 잠시 후 다시 시도해주세요.'); }
    }

    async function loadLeads() {
      const response = await fetch(API_URL, { headers: { 'X-Admin-Key': adminKey } });
      const result = await readJson(response);
      if (!response.ok || !Array.isArray(result.leads)) throw new Error(result.error || '접수 목록을 불러오지 못했습니다.');
      leads = result.leads;
      render();
    }

    $('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      adminKey = $('admin-key').value.trim();
      const button = $('login-button');
      button.disabled = true; button.textContent = '확인 중'; showError('login-error');
      try {
        await loadLeads();
        $('login').hidden = true; $('dashboard').hidden = false;
      } catch (error) {
        showError('login-error', error.message || '로그인하지 못했습니다.');
      } finally {
        button.disabled = false; button.textContent = '관리 화면 열기';
      }
    });

    function filteredLeads() {
      const term = $('search').value.trim().toLowerCase();
      if (!term) return leads;
      return leads.filter(row => [row.phone,row.region,row.inquiryType,row.airconType,row.utmCampaign,row.utmTerm]
        .some(value => String(value || '').toLowerCase().includes(term)));
    }

    function render() {
      const rows = filteredLeads();
      $('total-count').textContent = leads.length;
      $('new-count').textContent = leads.filter(row => row.status === 'new').length;
      $('won-count').textContent = leads.filter(row => ['won','completed'].includes(row.status)).length;
      $('visible-count').textContent = `${rows.length}건 표시`;
      $('empty').hidden = rows.length > 0;
      $('lead-rows').innerHTML = rows.map(row => `
        <tr>
          <td><b>#${row.id}</b><small>${escapeHtml(row.createdAt)}</small>${row.deleteAfter ? `<small>삭제 예정 ${escapeHtml(row.deleteAfter)}</small>` : ""}</td>
          <td><select data-id="${row.id}" aria-label="문의 ${row.id} 상태">${Object.entries(labels).map(([value,label]) => `<option value="${value}" ${row.status===value?'selected':''}>${label}</option>`).join('')}</select></td>
          <td><a href="tel:${escapeHtml(String(row.phone).replaceAll('-',''))}">${escapeHtml(row.phone)}</a><small>${escapeHtml(row.region)}</small></td>
          <td><b>${escapeHtml(row.inquiryType)}</b><small>${escapeHtml(row.airconType)}</small></td>
          <td><b>${escapeHtml(row.utmCampaign || row.utmSource || '직접 유입')}</b><small>${escapeHtml(row.utmTerm || row.referrer || '-')}</small></td>
        </tr>`).join('');
      document.querySelectorAll('#lead-rows select').forEach(select => select.addEventListener('change', changeStatus));
    }

    async function changeStatus(event) {
      const select = event.currentTarget;
      const row = leads.find(item => item.id === Number(select.dataset.id));
      const previous = row.status; row.status = select.value; showError('dashboard-error'); render();
      try {
        const response = await fetch(API_URL, { method:'PATCH', headers:{'Content-Type':'application/json','X-Admin-Key':adminKey}, body:JSON.stringify({id:row.id,status:row.status}) });
        const result = await readJson(response);
        if (!response.ok) throw new Error(result.error || '상태 변경에 실패했습니다.'); await loadLeads();
      } catch (error) { row.status=previous; render(); showError('dashboard-error', error.message); }
    }

    $('logout').addEventListener('click', () => { adminKey=''; leads=[]; $('admin-key').value=''; $('lead-rows').textContent=''; $('dashboard').hidden=true; $('login').hidden=false; });
    $('search').addEventListener('input', render);
    $('refresh').addEventListener('click', async () => { try { await loadLeads(); showError('dashboard-error'); } catch(error) { showError('dashboard-error',error.message); } });
    $('csv').addEventListener('click', () => {
      const headers=['번호','접수시각','상태','지역','문의유형','에어컨종류','연락처','UTM소스','UTM매체','캠페인','콘텐츠','키워드','유입URL'];
      const lines=filteredLeads().map(row => [row.id,row.createdAt,labels[row.status]||row.status,row.region,row.inquiryType,row.airconType,row.phone,row.utmSource,row.utmMedium,row.utmCampaign,row.utmContent,row.utmTerm,row.sourceUrl].map(value => `"${String(value??'').replaceAll('"','""')}"`).join(','));
      const blob=new Blob(['\uFEFF'+[headers.join(','),...lines].join('\n')],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob); const link=document.createElement('a'); link.href=url; link.download=`aircon-leads-${new Date().toISOString().slice(0,10)}.csv`; link.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
